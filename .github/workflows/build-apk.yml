name: Build Ionic Android APK

on:
  push:
    branches:
      - main


  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Get the source code
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Install Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ----------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci

      # ----------------------------------------------------------
      # 4. Build the Ionic/Vue web app
      # ----------------------------------------------------------
      - name: Build Ionic application
        run: npm run build
        env:
          # Firebase config baked into the build. Add these as repo secrets
          # under Settings -> Secrets and variables -> Actions.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # ----------------------------------------------------------
      # 5. Install Java 21
      # Capacitor Android currently compiles with Java 21.
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ----------------------------------------------------------
      # 6. Add the Android platform (this repo doesn't commit /android)
      # ----------------------------------------------------------
      - name: Add Capacitor Android platform
        run: npx cap add android

      # ----------------------------------------------------------
      # 7. Copy the web build + plugins into the Android project
      # ----------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ----------------------------------------------------------
      # 8. Give Gradle execution permission
      # ----------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ----------------------------------------------------------
      # 9. Build the debug APK
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ----------------------------------------------------------
      # 10. Rename the generated APK
      # ----------------------------------------------------------
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WorkoutActivityTracker.apk

      # ----------------------------------------------------------
      # 11. Upload the APK as a workflow artifact
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutActivityTracker-APK
          path: WorkoutActivityTracker.apk
          if-no-files-found: error
          retention-days: 30
